# DeployHub Nginx Config
# Routes traffic from generated subdomains to deployed containers

# Each deployed app gets routed by its port
# In production, this would use subdomain routing like:
#   app-name.deployhub.yourdomain.com → localhost:<port>

server {
    listen 80;
    server_name localhost;

    # DeployHub API
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # DeployHub Dashboard (Vite dev)
    location / {
        proxy_pass http://localhost:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

